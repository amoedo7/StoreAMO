name: bootstrap-release-006

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release/trigger-bootstrap-v0.0.6'

permissions:
  contents: write

jobs:
  build-sign-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'

      - name: Require fresh installer release
        run: |
          set -euo pipefail
          if gh release view bootstrap-v0.0.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'bootstrap-v0.0.6 already exists; refusing to replace it.' >&2
            exit 1
          fi
          test -s release/storeamo-recovery-public.pem

      - name: Establish permanent StoreAMO Install identity
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/storeamo-installer-release.p12"
          RECOVERY_TXT="$RUNNER_TEMP/INSTALLER-RECOVERY.txt"
          RECOVERY_TAR="$RUNNER_TEMP/StoreAMO-Install-signing-recovery-v1.tar.gz"
          PASS="$(openssl rand -hex 32)"
          ALIAS='storeamo-installer-release'
          echo "::add-mask::$PASS"

          keytool -genkeypair -v \
            -keystore "$KS" -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -sigalg SHA256withRSA -validity 10000 \
            -dname 'CN=DesarrollAMO StoreAMO Installer, OU=Mobile, O=DesarrollAMO, C=AR'
          chmod 600 "$KS"

          CERT_SHA="$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          test -n "$CERT_SHA"
          cat > "$RECOVERY_TXT" <<EOF
          STOREAMO INSTALL SIGNING RECOVERY v1
          Alias: $ALIAS
          Store password: $PASS
          Key password: $PASS
          Certificate SHA-256: $CERT_SHA
          Canonical package: com.desarrollamo.storeamo.installer
          First release: 0.0.6
          EOF
          chmod 600 "$RECOVERY_TXT"
          cp "$KS" "$RUNNER_TEMP/storeamo-installer-release.p12"
          tar -C "$RUNNER_TEMP" -czf "$RECOVERY_TAR" storeamo-installer-release.p12 INSTALLER-RECOVERY.txt
          mkdir -p dist/recovery
          openssl cms -encrypt -binary -aes256 \
            -in "$RECOVERY_TAR" -outform DER \
            -out dist/recovery/StoreAMO-Install-signing-recovery-v1.cms \
            release/storeamo-recovery-public.pem
          test -s dist/recovery/StoreAMO-Install-signing-recovery-v1.cms
          rm -f "$RECOVERY_TXT" "$RECOVERY_TAR"

          printf 'INSTALLER_STORE_PASSWORD=%s\n' "$PASS" >> "$GITHUB_ENV"
          printf 'INSTALLER_KEY_PASSWORD=%s\n' "$PASS" >> "$GITHUB_ENV"
          printf 'INSTALLER_KEY_ALIAS=%s\n' "$ALIAS" >> "$GITHUB_ENV"
          printf 'INSTALLER_CERT_SHA=%s\n' "$CERT_SHA" >> "$GITHUB_ENV"

      - name: Validate and build installer
        run: |
          set -euo pipefail
          python scripts/validate_install_pipeline.py
          gradle :bootstrap:assembleRelease --stacktrace

      - name: Sign and verify installer
        run: |
          set -euo pipefail
          IN="bootstrap/build/outputs/apk/release/bootstrap-release-unsigned.apk"
          OUT="dist/StoreAMO-Install-0.0.6.apk"
          test -s "$IN"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/storeamo-installer-release.p12" \
            --ks-key-alias "$INSTALLER_KEY_ALIAS" \
            --ks-pass env:INSTALLER_STORE_PASSWORD \
            --key-pass env:INSTALLER_KEY_PASSWORD \
            --out "$OUT" "$IN"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee /tmp/installer-signature.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/installer-signature.txt | head -1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$INSTALLER_CERT_SHA" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT"
          test "$(printf '%s' "$CERT" | tr -d ':')" = "$EXPECTED"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$OUT" | tee /tmp/installer-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo.installer' versionCode='6' versionName='0.0.6'" /tmp/installer-badging.txt
          ! grep -q 'application-debuggable' /tmp/installer-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$OUT" | tee /tmp/installer-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/installer-permissions.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/installer-permissions.txt
          ! grep -q 'REQUEST_DELETE_PACKAGES\|QUERY_ALL_PACKAGES\|PACKAGE_USAGE_STATS\|SYSTEM_ALERT_WINDOW\|BIND_ACCESSIBILITY_SERVICE' /tmp/installer-permissions.txt
          (cd dist && sha256sum StoreAMO-Install-0.0.6.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Publish StoreAMO Install 0.0.6
        run: |
          set -euo pipefail
          gh release create bootstrap-v0.0.6 \
            dist/StoreAMO-Install-0.0.6.apk \
            dist/SHA256SUMS.txt \
            dist/recovery/StoreAMO-Install-signing-recovery-v1.cms \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'StoreAMO Install 0.0.6' \
            --notes "Hotfix del arranque desde cero: corrige el fallo Android 'Files still open' cerrando todos los streams de PackageInstaller antes de commit(). Usa la identidad estable com.desarrollamo.storeamo.installer, verifica SHA-256 y mantiene confirmación visible de Android. No desactiva ni elude Play Protect. Certificado SHA-256: ${INSTALLER_CERT_SHA}."
