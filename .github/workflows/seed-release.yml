name: seed-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release/trigger-seed-v0.0.1'

permissions:
  contents: write

jobs:
  build-sign-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'

      - name: Require unique immutable seed
        run: |
          set -euo pipefail
          if gh release view seed-v0.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'seed-v0.0.1 already exists; the canonical seed is immutable.' >&2
            exit 1
          fi
          test -s release/storeamo-recovery-public.pem

      - name: Establish seed signing identity
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/storeamo-seed-release.p12"
          RECOVERY_TXT="$RUNNER_TEMP/SEED-RECOVERY.txt"
          RECOVERY_TAR="$RUNNER_TEMP/StoreAMO-seed-signing-recovery-v1.tar.gz"
          PASS="$(openssl rand -hex 32)"
          ALIAS='storeamo-seed-release'
          echo "::add-mask::$PASS"

          keytool -genkeypair -v \
            -keystore "$KS" -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -sigalg SHA256withRSA -validity 10000 \
            -dname 'CN=DesarrollAMO StoreAMO Seed, OU=Mobile, O=DesarrollAMO, C=AR'
          chmod 600 "$KS"

          CERT_SHA="$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          test -n "$CERT_SHA"
          cat > "$RECOVERY_TXT" <<EOF
          STOREAMO SEED SIGNING RECOVERY v1
          Alias: $ALIAS
          Store password: $PASS
          Key password: $PASS
          Certificate SHA-256: $CERT_SHA
          Canonical package: com.desarrollamo.storeamo.seed
          Canonical version: 0.0.1
          Policy: immutable seed; do not replace the public seed artifact in place
          EOF
          chmod 600 "$RECOVERY_TXT"
          tar -C "$RUNNER_TEMP" -czf "$RECOVERY_TAR" storeamo-seed-release.p12 SEED-RECOVERY.txt
          mkdir -p dist/recovery
          openssl cms -encrypt -binary -aes256 \
            -in "$RECOVERY_TAR" -outform DER \
            -out dist/recovery/StoreAMO-seed-signing-recovery-v1.cms \
            release/storeamo-recovery-public.pem
          test -s dist/recovery/StoreAMO-seed-signing-recovery-v1.cms
          rm -f "$RECOVERY_TXT" "$RECOVERY_TAR"

          printf 'SEED_STORE_PASSWORD=%s\n' "$PASS" >> "$GITHUB_ENV"
          printf 'SEED_KEY_PASSWORD=%s\n' "$PASS" >> "$GITHUB_ENV"
          printf 'SEED_KEY_ALIAS=%s\n' "$ALIAS" >> "$GITHUB_ENV"
          printf 'SEED_CERT_SHA=%s\n' "$CERT_SHA" >> "$GITHUB_ENV"

      - name: Validate and build canonical seed
        run: |
          set -euo pipefail
          python scripts/validate_install_pipeline.py
          gradle :bootstrap:assembleRelease --stacktrace

      - name: Sign and verify seed
        run: |
          set -euo pipefail
          IN="bootstrap/build/outputs/apk/release/bootstrap-release-unsigned.apk"
          OUT="dist/StoreAMO-0.0.1.apk"
          test -s "$IN"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/storeamo-seed-release.p12" \
            --ks-key-alias "$SEED_KEY_ALIAS" \
            --ks-pass env:SEED_STORE_PASSWORD \
            --key-pass env:SEED_KEY_PASSWORD \
            --out "$OUT" "$IN"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee /tmp/seed-signature.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/seed-signature.txt | head -1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$SEED_CERT_SHA" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT"
          test "$(printf '%s' "$CERT" | tr -d ':')" = "$EXPECTED"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$OUT" | tee /tmp/seed-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo.seed' versionCode='1' versionName='0.0.1'" /tmp/seed-badging.txt
          ! grep -q 'application-debuggable' /tmp/seed-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$OUT" | tee /tmp/seed-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/seed-permissions.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/seed-permissions.txt
          ! grep -q 'REQUEST_DELETE_PACKAGES\|QUERY_ALL_PACKAGES\|PACKAGE_USAGE_STATS\|SYSTEM_ALERT_WINDOW\|BIND_ACCESSIBILITY_SERVICE' /tmp/seed-permissions.txt
          (cd dist && sha256sum StoreAMO-0.0.1.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Publish canonical StoreAMO seed
        run: |
          set -euo pipefail
          gh release create seed-v0.0.1 \
            dist/StoreAMO-0.0.1.apk \
            dist/SHA256SUMS.txt \
            dist/recovery/StoreAMO-seed-signing-recovery-v1.cms \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'StoreAMO 0.0.1 — Semilla' \
            --notes "Semilla canónica e inmutable de StoreAMO. Una sola pantalla: Actualizaciones. Declara INTERNET y REQUEST_INSTALL_PACKAGES porque su único trabajo es descargar, verificar SHA-256 e instalar/actualizar la Store estable mediante el PackageInstaller visible de Android. No pide almacenamiento, accesibilidad, overlay ni QUERY_ALL_PACKAGES. No desactiva ni elude Play Protect. Certificado SHA-256: ${SEED_CERT_SHA}."
