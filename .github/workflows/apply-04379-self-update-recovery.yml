name: apply-04379-self-update-recovery

on:
  push:
    branches: [fix/self-update-bootstrap-04379]
    paths:
      - 'scripts/apply_04379_self_update_recovery.py'
      - '.github/workflows/apply-04379-self-update-recovery.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/self-update-bootstrap-04379
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_04379_self_update_recovery.py
      - name: Validate patch
        run: python scripts/validate_04379_self_update_recovery.py
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties app/build.gradle app/src/main/java/com/desarrollamo/storeamo/MainActivityV4.kt scripts/validate_04379_self_update_recovery.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: StoreAMO 0.4.3.79 externalize self-update'
          git push origin HEAD:fix/self-update-bootstrap-04379
