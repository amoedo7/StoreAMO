name: StoreAMO bootstrap 0.0.1

on:
  push:
    paths:
      - 'bootstrap/**'
      - 'settings.gradle'
      - '.github/workflows/bootstrap-0.0.1.yml'
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'settings.gradle'
      - '.github/workflows/bootstrap-0.0.1.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish immutable bootstrap Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  test-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests and lightweight debug build
        run: gradle :bootstrap:testDebugUnitTest :bootstrap:assembleDebug --stacktrace
      - name: Verify bootstrap identity
        run: |
          set -euo pipefail
          APK=bootstrap/build/outputs/apk/debug/bootstrap-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/bootstrap-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo.bootstrap.test' versionCode='1' versionName='0.0.1-test'" /tmp/bootstrap-badging.txt
          ls -lh "$APK"
      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: StoreAMO-bootstrap-test
          path: bootstrap/build/outputs/apk/debug/bootstrap-debug.apk

  publish-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: test-bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare stable StoreAMO signing key
        env:
          STOREAMO_SIGNING_KEY_B64: ${{ secrets.STOREAMO_SIGNING_KEY_B64 }}
          STOREAMO_STORE_PASSWORD: ${{ secrets.STOREAMO_STORE_PASSWORD }}
          STOREAMO_KEY_ALIAS: ${{ secrets.STOREAMO_KEY_ALIAS }}
          STOREAMO_KEY_PASSWORD: ${{ secrets.STOREAMO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STOREAMO_SIGNING_KEY_B64"
          test -n "$STOREAMO_STORE_PASSWORD"
          test -n "$STOREAMO_KEY_ALIAS"
          test -n "$STOREAMO_KEY_PASSWORD"
          printf '%s' "$STOREAMO_SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/storeamo-release.jks"
          chmod 600 "$RUNNER_TEMP/storeamo-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/storeamo-release.jks" -storepass "$STOREAMO_STORE_PASSWORD" -alias "$STOREAMO_KEY_ALIAS" >/dev/null
      - name: Build signed 0.0.1
        env:
          STOREAMO_KEYSTORE_PATH: ${{ runner.temp }}/storeamo-release.jks
          STOREAMO_STORE_PASSWORD: ${{ secrets.STOREAMO_STORE_PASSWORD }}
          STOREAMO_KEY_ALIAS: ${{ secrets.STOREAMO_KEY_ALIAS }}
          STOREAMO_KEY_PASSWORD: ${{ secrets.STOREAMO_KEY_PASSWORD }}
          CI_RELEASE_SIGNING_REQUIRED: 'true'
        run: gradle :bootstrap:assembleRelease --stacktrace
      - name: Verify package, version, signature and hash
        run: |
          set -euo pipefail
          APK=bootstrap/build/outputs/apk/release/bootstrap-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/bootstrap-release-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo' versionCode='1' versionName='0.0.1'" /tmp/bootstrap-release-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/bootstrap-signing.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' /tmp/bootstrap-signing.txt
          mkdir -p dist
          cp "$APK" dist/StoreAMO.apk
          (cd dist && sha256sum StoreAMO.apk > SHA256SUMS.txt)
          ls -lh dist/StoreAMO.apk
      - name: Publish immutable bootstrap Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view bootstrap --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'bootstrap Release already exists; refusing to replace the permanent entry APK'
            exit 1
          fi
          gh release create bootstrap \
            dist/StoreAMO.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'StoreAMO 0.0.1 · Bootstrap' \
            --notes 'Punto de entrada ultraliviano de StoreAMO. Sólo consulta Releases oficiales, verifica SHA-256 y se reemplaza por la StoreAMO estable más nueva mediante el instalador de Android.' \
            --prerelease
