name: production-update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release/trigger-v0.4.3.87'

permissions:
  contents: write

jobs:
  sign-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      STOREAMO_RELEASE_KEYSTORE_B64: ${{ secrets.STOREAMO_RELEASE_KEYSTORE_B64 }}
      STOREAMO_RELEASE_STORE_PASSWORD: ${{ secrets.STOREAMO_RELEASE_STORE_PASSWORD }}
      STOREAMO_RELEASE_KEY_PASSWORD: ${{ secrets.STOREAMO_RELEASE_KEY_PASSWORD }}
      STOREAMO_RELEASE_KEY_ALIAS: ${{ secrets.STOREAMO_RELEASE_KEY_ALIAS }}
      EXPECTED_CERT_SHA256: 7BD60FD751723041CF2802BEA01FBD83700410A1FD2DD019CACBCD739CB72DCF
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'

      - name: Validate source and release target
        run: |
          set -euo pipefail
          test "$(sed -n 's/^storeamo.versionPatch=//p' gradle.properties)" = "87"
          python scripts/validate_install_pipeline.py
          if gh release view v0.4.3.87 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.4.3.87 already exists' >&2
            exit 1
          fi

      - name: Restore canonical signing identity from Actions secrets
        run: |
          set -euo pipefail
          test -n "$STOREAMO_RELEASE_KEYSTORE_B64"
          test -n "$STOREAMO_RELEASE_STORE_PASSWORD"
          test -n "$STOREAMO_RELEASE_KEY_PASSWORD"
          test -n "$STOREAMO_RELEASE_KEY_ALIAS"
          KS="$RUNNER_TEMP/storeamo-release.jks"
          python - "$KS" <<'PY'
          import base64
          import os
          import re
          import sys

          raw = os.environ["STOREAMO_RELEASE_KEYSTORE_B64"].strip()
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in {'"', "'"}:
              raw = raw[1:-1]
          if ";base64," in raw[:160]:
              raw = raw.split(",", 1)[1]
          normalized = re.sub(r"\s+", "", raw)
          decoded = base64.b64decode(normalized, validate=True)
          if not decoded:
              raise SystemExit("STOREAMO_SIGNING_SECRET_EMPTY_KEYSTORE")
          open(sys.argv[1], "wb").write(decoded)
          print("STOREAMO_SIGNING_SECRET_DECODED", len(decoded))
          PY
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storepass "$STOREAMO_RELEASE_STORE_PASSWORD" -alias "$STOREAMO_RELEASE_KEY_ALIAS" >/dev/null
          CERT="$(keytool -list -v -keystore "$KS" -storepass "$STOREAMO_RELEASE_STORE_PASSWORD" -alias "$STOREAMO_RELEASE_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          echo "STOREAMO_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Build StoreAMO 0.4.3.87
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign and verify update continuity
        run: |
          set -euo pipefail
          IN="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="StoreAMO-0.4.3.87.apk"
          test -s "$IN"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$STOREAMO_KEYSTORE" \
            --ks-key-alias "$STOREAMO_RELEASE_KEY_ALIAS" \
            --ks-pass env:STOREAMO_RELEASE_STORE_PASSWORD \
            --key-pass env:STOREAMO_RELEASE_KEY_PASSWORD \
            --out "$OUT" "$IN"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee /tmp/new-cert.txt
          NEW_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/new-cert.txt | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$NEW_CERT" = "$EXPECTED_CERT_SHA256"

          mkdir -p /tmp/previous
          gh release download v0.4.3.86 --repo "$GITHUB_REPOSITORY" -p 'StoreAMO-0.4.3.86.apk' -D /tmp/previous
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs /tmp/previous/StoreAMO-0.4.3.86.apk | tee /tmp/old-cert.txt
          OLD_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/old-cert.txt | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$OLD_CERT" = "$EXPECTED_CERT_SHA256"
          test "$OLD_CERT" = "$NEW_CERT"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$OUT" | tee /tmp/badging.txt
          grep -q "package: name='com.desarrollamo.storeamo' versionCode='430087' versionName='0.4.3.87'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$OUT" | tee /tmp/permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/permissions.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/permissions.txt
          ! grep -q 'REQUEST_DELETE_PACKAGES\|QUERY_ALL_PACKAGES\|PACKAGE_USAGE_STATS\|SYSTEM_ALERT_WINDOW\|BIND_ACCESSIBILITY_SERVICE' /tmp/permissions.txt
          sha256sum "$OUT" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish StoreAMO 0.4.3.87
        run: |
          set -euo pipefail
          gh release create v0.4.3.87 \
            StoreAMO-0.4.3.87.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'StoreAMO 0.4.3.87' \
            --notes 'StoreAMO 0.4.3.87 hace visibles los seis utilitarios Android aun cuando Termux no está instalado y ofrece acceso explícito a sus fuentes de instalación. Después de instalarlo, cada herramienta se descarga desde su repositorio público fijado por commit y se verifica con SHA-256. Conserva exactamente la misma identidad de firma permanente 7BD60FD7… de 0.4.3.86.'
