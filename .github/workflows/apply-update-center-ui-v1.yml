name: apply-update-center-ui-v1

on:
  push:
    branches: [chatgpt/update-center-ui-v1]
    paths: ['.github/workflows/apply-update-center-ui-v1.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/update-center-ui-v1
          fetch-depth: 0
      - name: Connect persisted update preferences to StoreAMO UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/desarrollamo/storeamo/MainActivityV4.kt')
          s=p.read_text(encoding='utf-8')

          anchor='import com.desarrollamo.storeamo.util.DownloadInstaller\n'
          add='''import com.desarrollamo.storeamo.update.UpdateChannel
          import com.desarrollamo.storeamo.update.UpdateCheckFrequency
          import com.desarrollamo.storeamo.update.UpdatePreferencesStore
          '''.replace('          ','')
          assert anchor in s and 'UpdatePreferencesStore' not in s
          s=s.replace(anchor, anchor+add, 1)

          anchor='    val migrationPrefs = remember { context.getSharedPreferences(MIGRATION_PREFS, Context.MODE_PRIVATE) }\n'
          assert anchor in s
          s=s.replace(anchor, anchor+'    val updatePreferencesStore = remember { UpdatePreferencesStore(context) }\n', 1)

          anchor='    var notice by remember { mutableStateOf<String?>(null) }\n'
          assert anchor in s
          s=s.replace(anchor, anchor+'    var updatePreferences by remember { mutableStateOf(updatePreferencesStore.load()) }\n', 1)

          insert_before='                    item { ActionV4("Actualizar catálogo y valoraciones", "Trae versiones, ranking comunitario y estado actual.", "Actualizar", ::refreshAll) }\n'
          assert insert_before in s
          add='''                    item { SectionV4("ACTUALIZACIONES", "Preferencias") }
          
                              item {
                                  ActionV4("Frecuencia de comprobación", "Actual: ${updatePreferences.frequency.displayLabel()}", "Cambiar") {
                                      val next = when (updatePreferences.frequency) {
                                          UpdateCheckFrequency.MANUAL -> UpdateCheckFrequency.DAILY
                                          UpdateCheckFrequency.DAILY -> UpdateCheckFrequency.WEEKLY
                                          UpdateCheckFrequency.WEEKLY -> UpdateCheckFrequency.MANUAL
                                      }
                                      updatePreferences = updatePreferences.copy(frequency = next).also(updatePreferencesStore::save)
                                  }
                              }
                              item {
                                  ActionV4("Canal de versiones", "Actual: ${updatePreferences.channel.displayLabel()}", "Cambiar") {
                                      val next = if (updatePreferences.channel == UpdateChannel.STABLE) UpdateChannel.BETA else UpdateChannel.STABLE
                                      updatePreferences = updatePreferences.copy(channel = next).also(updatePreferencesStore::save)
                                  }
                              }
                              item {
                                  ToggleV4("Actualización automática", "Sólo se habilita por decisión explícita. Android conserva sus confirmaciones de seguridad.", updatePreferences.autoUpdateEnabled) {
                                      updatePreferences = updatePreferences.copy(autoUpdateEnabled = it).also(updatePreferencesStore::save)
                                  }
                              }
                              item {
                                  ToggleV4("Sólo Wi-Fi", "Impide que la política automática use una conexión medida.", updatePreferences.wifiOnly) {
                                      updatePreferences = updatePreferences.copy(wifiOnly = it).also(updatePreferencesStore::save)
                                  }
                              }
                              item {
                                  ToggleV4("Notificaciones de actualizaciones", "Permite avisos cuando StoreAMO detecta versiones nuevas.", updatePreferences.notificationsEnabled) {
                                      updatePreferences = updatePreferences.copy(notificationsEnabled = it).also(updatePreferencesStore::save)
                                  }
                              }
          '''.replace('          ','')
          s=s.replace(insert_before, add+insert_before, 1)
          s += '''
          private fun UpdateCheckFrequency.displayLabel(): String = when (this) {
              UpdateCheckFrequency.MANUAL -> "Manual"
              UpdateCheckFrequency.DAILY -> "Diaria"
              UpdateCheckFrequency.WEEKLY -> "Semanal"
          }

          private fun UpdateChannel.displayLabel(): String = when (this) {
              UpdateChannel.STABLE -> "Estable"
              UpdateChannel.BETA -> "Beta / candidate"
          }
          '''.replace('          ','')
          p.write_text(s, encoding='utf-8')

          v=Path('scripts/validate_update_safety.py')
          t=v.read_text(encoding='utf-8')
          marker='    print("STOREAMO_UPDATE_SAFETY_OK")\n'
          assert marker in t
          checks='''    prefs_ui = read("app/src/main/java/com/desarrollamo/storeamo/MainActivityV4.kt")
              for needle in (
                  "UpdatePreferencesStore(context)",
                  "Frecuencia de comprobación",
                  "Canal de versiones",
                  "Actualización automática",
                  "Sólo Wi-Fi",
                  "Notificaciones de actualizaciones",
              ):
                  require(prefs_ui, needle, f"update preferences UI: {needle}")

          '''.replace('          ','')
          v.write_text(t.replace(marker, checks+marker, 1), encoding='utf-8')

          Path('.github/workflows/apply-update-center-ui-v1.yml').unlink()
          PY
      - name: Commit UI wiring
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT DesarrollAMO Operator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(storeamo): connect persisted update preferences to UI'
          git push origin HEAD:chatgpt/update-center-ui-v1
