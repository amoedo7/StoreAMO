name: apply-signature-migration-fix-admin

on:
  push:
    branches: [main]
    paths:
      - signature-migration.trigger
      - .github/workflows/apply-signature-migration-fix-admin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/signature-migration-once
          fetch-depth: 0
      - name: Apply migration UX and 0.4.3.71
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/desarrollamo/storeamo/InstallFlowActivity.kt')
          s = p.read_text(encoding='utf-8')

          if 'private var awaitingSignatureMigration = false' not in s:
              old = '    private var installStartedAt = 0L\n    private var persistentErrorVisible = false\n'
              assert old in s
              s = s.replace(old, old + '    private var awaitingSignatureMigration = false\n', 1)

          if 'if (awaitingSignatureMigration) {' not in s:
              old = '        if (persistentErrorVisible) return\n\n        if (awaitingPermission) {\n'
              new = '''        if (awaitingSignatureMigration) {
            val packageName = applicationId
            awaitingSignatureMigration = false
            if (packageName != null && !DownloadInstaller.isPackageInstalled(this, packageName)) {
                persistentErrorVisible = false
                status.text = "Migración completada"
                detail.text = "La firma legacy ya no está instalada · continuando con $appName $targetVersion."
                progress.visibility = View.VISIBLE
                progress.isIndeterminate = true
                startInstall()
            } else {
                showKnownSignatureMigration(cancelled = true)
            }
            return
        }
        if (persistentErrorVisible) return

        if (awaitingPermission) {
'''
              assert old in s
              s = s.replace(old, new, 1)

          if 'showKnownSignatureMigration(cancelled = false)' not in s:
              old = '''        val preflight = DownloadInstaller.preflightProblem(this, apkFile)
        if (preflight != null) {
            showStaticInstallError("$preflight\\n\\n${diagnosticContext("PREFLIGHT_BLOCKED")}")
            return
        }
'''
              new = '''        val migration = DownloadInstaller.knownOneTimeSignatureMigration(this, apkFile)
        if (migration != null) {
            showKnownSignatureMigration(cancelled = false)
            return
        }

        val preflight = DownloadInstaller.preflightProblem(this, apkFile)
        if (preflight != null) {
            showStaticInstallError("$preflight\\n\\n${diagnosticContext("PREFLIGHT_BLOCKED")}")
            return
        }
'''
              assert old in s
              s = s.replace(old, new, 1)

          if 'private fun showKnownSignatureMigration(' not in s:
              anchor = '    private fun showStaticInstallError(message: String) {\n'
              method = '''    private fun showKnownSignatureMigration(cancelled: Boolean) {
        polling = false
        fallbackDownloading = false
        verifying = false
        awaitingPermission = false
        installing = false
        persistentErrorVisible = true
        handler.removeCallbacks(pollDownload)
        handler.removeCallbacks(checkInstalled)

        progress.isIndeterminate = false
        progress.visibility = View.GONE
        status.text = if (cancelled) "MIGRACIÓN PENDIENTE" else "MIGRACIÓN ÚNICA DE FIRMA"
        detail.text = buildString {
            if (cancelled) append("La desinstalación anterior no se completó.\\n\\n")
            append("Detectamos exactamente la build legacy de DepositAMO 0.1.0 que fue publicada con una clave temporal. ")
            append("Esa clave privada no existe, por lo que Android no permite convertirla en una actualización firmada con la identidad canónica.\\n\\n")
            append("Este paso ocurre UNA SOLA VEZ: Android eliminará la build legacy y StoreAMO instalará automáticamente la línea canónica. ")
            append("Después, las versiones siguientes se actualizan normalmente sin desinstalar.\\n\\n")
            append("Importante: Android puede borrar los datos privados de la build legacy al desinstalarla.\\n\\n")
            append(diagnosticContext("KNOWN_LEGACY_SIGNER_MIGRATION"))
        }

        retry.visibility = View.VISIBLE
        retry.text = "MIGRAR UNA VEZ Y ACTUALIZAR"
        retry.setOnClickListener {
            val packageName = applicationId
            if (packageName.isNullOrBlank()) {
                showStaticInstallError("No hay package válido para completar la migración.\\n\\n${diagnosticContext("MIGRATION_PACKAGE_MISSING")}")
                return@setOnClickListener
            }
            persistentErrorVisible = false
            awaitingSignatureMigration = true
            retry.visibility = View.GONE
            close.visibility = View.GONE
            progress.visibility = View.VISIBLE
            progress.isIndeterminate = true
            status.text = "Migrando firma legacy"
            detail.text = "Android va a pedir confirmar la eliminación de la build antigua. Al volver, StoreAMO continuará solo con la instalación nueva."
            runCatching { DownloadInstaller.requestOfficialUninstall(this, packageName) }
                .onFailure { error ->
                    awaitingSignatureMigration = false
                    showStaticInstallError(
                        "No se pudo abrir el desinstalador oficial: ${error.message.orEmpty()}\\n\\n" +
                            diagnosticContext("MIGRATION_UNINSTALLER_FAILED")
                    )
                }
        }
        close.visibility = View.VISIBLE
    }

'''
              assert anchor in s
              s = s.replace(anchor, method + anchor, 1)

          s = s.replace('        append("\\nStoreAMO: 0.4.3.69")\n', '        append("\\nStoreAMO: ").append(BuildConfig.VERSION_NAME)\n', 1)
          p.write_text(s, encoding='utf-8')

          props = Path('gradle.properties')
          t = props.read_text(encoding='utf-8')
          t = t.replace('storeamo.versionPatch=70', 'storeamo.versionPatch=71', 1)
          props.write_text(t, encoding='utf-8')

          build = Path('app/build.gradle')
          t = build.read_text(encoding='utf-8')
          t = t.replace("project.findProperty('storeamo.versionPatch') ?: '65'", "project.findProperty('storeamo.versionPatch') ?: '71'", 1)
          build.write_text(t, encoding='utf-8')

          ci = Path('.github/workflows/android-ci.yml')
          t = ci.read_text(encoding='utf-8')
          t = t.replace('test "$PATCH" = "70"', 'test "$PATCH" = "71"', 1)
          marker = '          python scripts/validate_uninstall_04370.py\n'
          if 'python scripts/validate_signature_migration.py' not in t:
              assert marker in t
              t = t.replace(marker, marker + '          python scripts/validate_signature_migration.py\n', 1)
          t = t.replace(
              'StoreAMO ${VERSION}: corrige la administración de apps instaladas. Desinstalar usa el desinstalador oficial de Android y, si el flujo no completa, abre automáticamente Info. de la aplicación. Cada app instalada también muestra un botón ⓘ junto a Desinstalar para abrir directamente esa pantalla del sistema.',
              'StoreAMO ${VERSION}: añade migración única guiada para la build legacy de DepositAMO con firma efímera. Tras esa única migración, StoreAMO exige continuidad de firma y las siguientes versiones se actualizan in-place. Conserva el flujo robusto de instalación y desinstalación.',
              1,
          )
          ci.write_text(t, encoding='utf-8')

          Path('scripts/validate_signature_migration.py').write_text('''#!/usr/bin/env python3
from pathlib import Path
root = Path(__file__).resolve().parents[1]
installer = (root / "app/src/main/java/com/desarrollamo/storeamo/util/DownloadInstaller.kt").read_text(encoding="utf-8")
flow = (root / "app/src/main/java/com/desarrollamo/storeamo/InstallFlowActivity.kt").read_text(encoding="utf-8")
props = (root / "gradle.properties").read_text(encoding="utf-8")
legacy = "653719d327467463b0081e52c330e1859d91876160e82fbd5068aef3bbb6f7b6"
canonical = "2b7ab55c5337735cad89c8006d94bf929244db21277fc9b7bd053f6ab8c5f685"
assert legacy in installer and canonical in installer
assert "knownOneTimeSignatureMigration" in installer
assert "requestOfficialUninstall" in installer
assert "StoreAMO no reemplaza firmas desconocidas" in installer
assert "MIGRACIÓN ÚNICA DE FIRMA" in flow
assert "MIGRAR UNA VEZ Y ACTUALIZAR" in flow
assert "awaitingSignatureMigration" in flow
assert "Después, las versiones siguientes se actualizan normalmente sin desinstalar" in flow
assert "BuildConfig.VERSION_NAME" in flow
assert "storeamo.versionPatch=71" in props
print("STOREAMO_SIGNATURE_MIGRATION_04371_OK")
''', encoding='utf-8')
          PY
      - name: Commit branch patch
        run: |
          set -euo pipefail
          git config user.name 'StoreAMO Signing Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/desarrollamo/storeamo/InstallFlowActivity.kt \
                  app/src/main/java/com/desarrollamo/storeamo/util/DownloadInstaller.kt \
                  app/build.gradle gradle.properties .github/workflows/android-ci.yml \
                  scripts/validate_signature_migration.py
          git commit -m 'StoreAMO 0.4.3.71 · migración única de firma y updates reales'
          git pull --rebase origin fix/signature-migration-once
          git push origin HEAD:fix/signature-migration-once
