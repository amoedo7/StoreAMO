name: apply-04378-install-session

on:
  push:
    branches: [fix/install-session-04378]
    paths:
      - 'scripts/apply_04378_install_session.py'
      - '.github/workflows/apply-04378-install-session.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/install-session-04378
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_04378_install_session.py
      - name: Validate patch
        run: python scripts/validate_04378_install_session.py
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties app/build.gradle app/src/main/java/com/desarrollamo/storeamo/InstallFlowActivity.kt app/src/main/java/com/desarrollamo/storeamo/util/InstallResultReceiver.kt scripts/validate_04378_install_session.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: StoreAMO 0.4.3.78 use PackageInstaller status'
          git push origin HEAD:fix/install-session-04378
