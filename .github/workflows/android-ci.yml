name: android-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'
      - name: Validate StoreAMO regressions
        run: |
          set -euo pipefail
          python scripts/validate_one_tap_update.py
          python scripts/validate_04365_features.py
          python scripts/validate_install_pipeline.py
          python scripts/validate_uninstall_04370.py
          python scripts/validate_signature_migration.py
          python scripts/validate_04373_design.py
          python scripts/validate_04375_community.py
          python scripts/validate_04379_self_update_recovery.py
          python scripts/validate_production_signing_setup.py
      - name: Validate seed boundary
        run: |
          set -euo pipefail
          grep -q 'REQUEST_INSTALL_PACKAGES' bootstrap/src/main/AndroidManifest.xml
          grep -q 'StoreAMO 0.0.1' bootstrap/src/main/AndroidManifest.xml
          grep -q 'StoreAMO-Seed/0.0.1' bootstrap/src/main/java/com/desarrollamo/storeamo/bootstrap/MainActivity.java
          grep -q 'PackageInstaller.SessionParams' bootstrap/src/main/java/com/desarrollamo/storeamo/bootstrap/MainActivity.java
          grep -q 'canRequestPackageInstalls' bootstrap/src/main/java/com/desarrollamo/storeamo/bootstrap/MainActivity.java
          grep -q 'ACTION_MANAGE_UNKNOWN_APP_SOURCES' bootstrap/src/main/java/com/desarrollamo/storeamo/bootstrap/MainActivity.java
          grep -q 'SHA-256' bootstrap/src/main/java/com/desarrollamo/storeamo/bootstrap/MainActivity.java
          grep -q 'STATUS_FAILURE_BLOCKED' bootstrap/src/main/java/com/desarrollamo/storeamo/bootstrap/InstallResultReceiver.java
      - name: Validate live feedback backend contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          base='https://ydmnavyadpztydontaqh.supabase.co/rest/v1/rpc/'
          key='sb_publishable_vWWs5BbvZvAOB6AgoWsSuQ_z8OnjDPZ'
          def rpc(name, payload):
              req=urllib.request.Request(base+name, data=json.dumps(payload).encode(), method='POST', headers={
                  'apikey': key,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'StoreAMO-CI/0.4.3',
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)
          summary=rpc('storeamo_feedback_summary', {'p_app_id':'climaamo'})
          assert isinstance(summary, list) and summary
          overview=rpc('storeamo_ratings_overview', {})
          assert isinstance(overview, list)
          comments=rpc('storeamo_public_comments', {'p_app_id':'climaamo','p_limit':3})
          assert isinstance(comments, list)
          print('STOREAMO_FEEDBACK_BACKEND_OK')
          PY
      - name: Build unsigned production releases
        run: gradle :app:assembleRelease :bootstrap:assembleRelease --stacktrace
      - name: Verify production identities and permissions
        run: |
          set -euo pipefail
          PATCH="$(sed -n 's/^storeamo.versionPatch=//p' gradle.properties)"
          test "$PATCH" -ge 83
          VERSION="0.4.3.${PATCH}"
          VERSION_CODE=$((430000 + PATCH))
          STORE="app/build/outputs/apk/release/app-release-unsigned.apk"
          SEED="bootstrap/build/outputs/apk/release/bootstrap-release-unsigned.apk"
          test -s "$STORE"
          test -s "$SEED"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$STORE" | tee /tmp/storeamo-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo' versionCode='${VERSION_CODE}' versionName='${VERSION}'" /tmp/storeamo-badging.txt
          ! grep -q 'application-debuggable' /tmp/storeamo-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$STORE" | tee /tmp/storeamo-permissions.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/storeamo-permissions.txt
          ! grep -q 'REQUEST_DELETE_PACKAGES\|QUERY_ALL_PACKAGES\|PACKAGE_USAGE_STATS\|SYSTEM_ALERT_WINDOW\|BIND_ACCESSIBILITY_SERVICE' /tmp/storeamo-permissions.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$SEED" | tee /tmp/seed-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo.seed' versionCode='1' versionName='0.0.1'" /tmp/seed-badging.txt
          ! grep -q 'application-debuggable' /tmp/seed-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$SEED" | tee /tmp/seed-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/seed-permissions.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/seed-permissions.txt
          ! grep -q 'REQUEST_DELETE_PACKAGES\|QUERY_ALL_PACKAGES\|PACKAGE_USAGE_STATS\|SYSTEM_ALERT_WINDOW\|BIND_ACCESSIBILITY_SERVICE' /tmp/seed-permissions.txt
          mkdir -p dist/store dist/seed
          cp "$STORE" "dist/store/StoreAMO-${VERSION}-unsigned.apk"
          cp "$SEED" "dist/seed/StoreAMO-0.0.1-unsigned.apk"
          sha256sum "dist/store/StoreAMO-${VERSION}-unsigned.apk" > dist/store/SHA256SUMS-unsigned.txt
          sha256sum "dist/seed/StoreAMO-0.0.1-unsigned.apk" > dist/seed/SHA256SUMS-unsigned.txt
          unzip -tqq "$STORE"
          unzip -tqq "$SEED"
      - name: Upload unsigned release candidates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: StoreAMO-production-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 7
