name: android-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stable-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate one-tap update regression
        run: python scripts/validate_one_tap_update.py

      - name: Prepare secure StoreAMO signing key
        env:
          STOREAMO_SIGNING_KEY_B64: ${{ secrets.STOREAMO_SIGNING_KEY_B64 }}
          STOREAMO_STORE_PASSWORD: ${{ secrets.STOREAMO_STORE_PASSWORD }}
          STOREAMO_KEY_ALIAS: ${{ secrets.STOREAMO_KEY_ALIAS }}
          STOREAMO_KEY_PASSWORD: ${{ secrets.STOREAMO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STOREAMO_SIGNING_KEY_B64"
          test -n "$STOREAMO_STORE_PASSWORD"
          test -n "$STOREAMO_KEY_ALIAS"
          test -n "$STOREAMO_KEY_PASSWORD"
          printf '%s' "$STOREAMO_SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/storeamo-release.jks"
          chmod 600 "$RUNNER_TEMP/storeamo-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/storeamo-release.jks" \
            -storepass "$STOREAMO_STORE_PASSWORD" \
            -alias "$STOREAMO_KEY_ALIAS" >/dev/null

      - name: Build secure StoreAMO APK
        env:
          STOREAMO_KEYSTORE_PATH: ${{ runner.temp }}/storeamo-release.jks
          STOREAMO_STORE_PASSWORD: ${{ secrets.STOREAMO_STORE_PASSWORD }}
          STOREAMO_KEY_ALIAS: ${{ secrets.STOREAMO_KEY_ALIAS }}
          STOREAMO_KEY_PASSWORD: ${{ secrets.STOREAMO_KEY_PASSWORD }}
          CI_RELEASE_SIGNING_REQUIRED: 'true'
        run: gradle assembleRelease --stacktrace

      - name: Prepare versioned artifact and verify identity
        run: |
          set -euo pipefail
          VERSION="0.5.0.${GITHUB_RUN_NUMBER}"
          VERSION_CODE=$((500000 + GITHUB_RUN_NUMBER))
          APK="app/build/outputs/apk/release/app-release.apk"
          mkdir -p dist
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.desarrollamo.storeamo' versionCode='${VERSION_CODE}' versionName='${VERSION}'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/signing.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' /tmp/signing.txt
          cp "$APK" "dist/StoreAMO-${VERSION}.apk"
          sha256sum "dist/StoreAMO-${VERSION}.apk" > dist/SHA256SUMS.txt
          sed -n 's/^Signer #1 certificate SHA-256 digest: /SIGNING_CERT_SHA256=/p' /tmp/signing.txt > dist/SIGNING_CERT_SHA256.txt
          echo "PACKAGE=com.desarrollamo.storeamo"
          echo "VERSION=${VERSION}"
          echo "VERSION_CODE=${VERSION_CODE}"

      - name: Upload StoreAMO APK
        uses: actions/upload-artifact@v6
        with:
          name: StoreAMO-stable-candidate
          path: dist/*

      - name: Publish secure self-update candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="0.5.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          gh release create "$TAG" \
            "dist/StoreAMO-${VERSION}.apk" \
            dist/SHA256SUMS.txt \
            dist/SIGNING_CERT_SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "StoreAMO ${VERSION}" \
            --notes "StoreAMO 0.5.0 security baseline: package estable com.desarrollamo.storeamo, firma privada inyectada únicamente desde GitHub Actions Secrets y fingerprint público verificable. La identidad debug anterior no se reutiliza como identidad de producción." \
            --prerelease
