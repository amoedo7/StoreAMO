name: android-ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare canonical StoreAMO signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/storeamo-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Validate StoreAMO regressions
        run: |
          python scripts/validate_one_tap_update.py
          python scripts/validate_04365_features.py
          python scripts/validate_install_pipeline.py
      - name: Build StoreAMO APK
        env:
          STOREAMO_DEBUG_KEYSTORE: ${{ runner.temp }}/storeamo-debug.keystore
        run: |
          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/storeamo-debug.keystore"
          gradle assembleDebug --stacktrace
      - name: Prepare versioned artifact
        run: |
          set -euo pipefail
          PATCH="$(sed -n 's/^storeamo.versionPatch=//p' gradle.properties)"
          test "$PATCH" = "68"
          VERSION="0.4.3.${PATCH}"
          VERSION_CODE=$((430000 + PATCH))
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/storeamo-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo.debug' versionCode='${VERSION_CODE}' versionName='${VERSION}'" /tmp/storeamo-badging.txt
          mkdir -p dist
          cp "$APK" "dist/StoreAMO-${VERSION}.apk"
          sha256sum "dist/StoreAMO-${VERSION}.apk" > dist/SHA256SUMS.txt
          unzip -tqq "dist/StoreAMO-${VERSION}.apk"
          echo "PACKAGE=com.desarrollamo.storeamo.debug"
          echo "VERSION=${VERSION}"
          echo "VERSION_CODE=${VERSION_CODE}"
          echo "APK=dist/StoreAMO-${VERSION}.apk"
      - name: Upload StoreAMO APK
        uses: actions/upload-artifact@v6
        with:
          name: StoreAMO-debug
          path: dist/*
      - name: Publish self-update release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PATCH="$(sed -n 's/^storeamo.versionPatch=//p' gradle.properties)"
          VERSION="0.4.3.${PATCH}"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "${TAG} ya está publicada; no se duplica la Release."
            exit 0
          fi
          gh release create "$TAG" dist/StoreAMO-${VERSION}.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "StoreAMO ${VERSION}" \
            --notes "StoreAMO ${VERSION}: rehace el flujo OBTENER/ACTUALIZAR para Android reales. Mantiene DownloadManager pero cambia automáticamente a descarga HTTPS directa si falla, muestra el motivo concreto, verifica SHA-256 y abre primero el instalador visible del sistema mediante FileProvider. Conserva PackageInstaller como fallback y la confirmación de seguridad de Android." \
            --prerelease
