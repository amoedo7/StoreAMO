name: android-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare reproducible debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/storeamo-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Show package identity
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "APK=$APK"
          echo "versionCode is generated from GITHUB_RUN_NUMBER so each successful CI build can update the previous one."
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: StoreAMO-debug
          path: app/build/outputs/apk/debug/*.apk
