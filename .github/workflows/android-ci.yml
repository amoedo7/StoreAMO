name: android-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare reproducible debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/storeamo-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Prepare versioned artifact
        run: |
          VERSION="0.4.2-dev.${GITHUB_RUN_NUMBER}-debug"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/StoreAMO-${VERSION}.apk"
          sha256sum "dist/StoreAMO-${VERSION}.apk" > dist/SHA256SUMS.txt
          echo "PACKAGE=com.desarrollamo.storeamo.debug"
          echo "VERSION=${VERSION}"
          echo "VERSION_CODE=$((420000 + GITHUB_RUN_NUMBER))"
          echo "APK=dist/StoreAMO-${VERSION}.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: StoreAMO-debug
          path: dist/*
