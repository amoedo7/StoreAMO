name: android-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'
      - name: Validate StoreAMO regressions
        run: |
          set -euo pipefail
          python scripts/validate_one_tap_update.py
          python scripts/validate_04365_features.py
          python scripts/validate_install_pipeline.py
          python scripts/validate_uninstall_04370.py
          python scripts/validate_signature_migration.py
          python scripts/validate_04373_design.py
          python scripts/validate_04375_community.py
          python scripts/validate_04379_self_update_recovery.py
      - name: Validate live feedback backend contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          base='https://ydmnavyadpztydontaqh.supabase.co/rest/v1/rpc/'
          key='sb_publishable_vWWs5BbvZvAOB6AgoWsSuQ_z8OnjDPZ'
          def rpc(name, payload):
              req=urllib.request.Request(base+name, data=json.dumps(payload).encode(), method='POST', headers={
                  'apikey': key,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'StoreAMO-CI/0.4.3',
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)
          summary=rpc('storeamo_feedback_summary', {'p_app_id':'climaamo'})
          assert isinstance(summary, list) and summary
          overview=rpc('storeamo_ratings_overview', {})
          assert isinstance(overview, list)
          comments=rpc('storeamo_public_comments', {'p_app_id':'climaamo','p_limit':3})
          assert isinstance(comments, list)
          print('STOREAMO_FEEDBACK_BACKEND_OK')
          PY
      - name: Build unsigned production release
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify production identity and permissions
        run: |
          set -euo pipefail
          PATCH="$(sed -n 's/^storeamo.versionPatch=//p' gradle.properties)"
          test "$PATCH" -ge 82
          VERSION="0.4.3.${PATCH}"
          VERSION_CODE=$((430000 + PATCH))
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/storeamo-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo' versionCode='${VERSION_CODE}' versionName='${VERSION}'" /tmp/storeamo-badging.txt
          ! grep -q 'application-debuggable' /tmp/storeamo-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" | tee /tmp/storeamo-permissions.txt
          ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/storeamo-permissions.txt
          ! grep -q 'android.permission.REQUEST_DELETE_PACKAGES' /tmp/storeamo-permissions.txt
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' /tmp/storeamo-permissions.txt
          mkdir -p dist
          cp "$APK" "dist/StoreAMO-${VERSION}-unsigned.apk"
          sha256sum "dist/StoreAMO-${VERSION}-unsigned.apk" > dist/SHA256SUMS-unsigned.txt
          unzip -tqq "$APK"
      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: StoreAMO-release-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 7
