name: bootstrap-0.0.2

on:
  pull_request:
    paths:
      - 'app/build.gradle'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/desarrollamo/storeamo/BootstrapActivity.kt'
      - 'app/src/main/java/com/desarrollamo/storeamo/data/SelfUpdateRepository.kt'
      - 'app/src/main/java/com/desarrollamo/storeamo/util/DownloadInstaller.kt'
      - 'scripts/validate_bootstrap_002.py'
      - '.github/workflows/bootstrap-001.yml'
  push:
    branches: [main]
    paths:
      - 'app/build.gradle'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/desarrollamo/storeamo/BootstrapActivity.kt'
      - 'app/src/main/java/com/desarrollamo/storeamo/data/SelfUpdateRepository.kt'
      - 'app/src/main/java/com/desarrollamo/storeamo/util/DownloadInstaller.kt'
      - 'scripts/validate_bootstrap_002.py'
      - '.github/workflows/bootstrap-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'

      - name: Prepare canonical StoreAMO signing key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 -d ci/storeamo-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Run StoreAMO regressions
        run: |
          set -euo pipefail
          python scripts/validate_bootstrap_002.py
          python scripts/validate_one_tap_update.py
          python scripts/validate_install_pipeline.py
          python scripts/validate_uninstall_04370.py
          python scripts/validate_signature_migration.py
          python scripts/validate_04379_self_update_recovery.py

      - name: Build bootstrap APK
        env:
          STOREAMO_DEBUG_KEYSTORE: ${{ runner.temp }}/storeamo-debug.keystore
        run: |
          set -euo pipefail
          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/storeamo-debug.keystore"
          gradle assembleDebug -Pstoreamo.bootstrapSeed=true --stacktrace

      - name: Verify bootstrap identity and artifact
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/bootstrap-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo.debug' versionCode='2' versionName='0.0.2'" /tmp/bootstrap-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/bootstrap-signature.txt
          EXPECTED="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/bootstrap-signature.txt | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$ACTUAL"
          test "$EXPECTED" = "$ACTUAL"
          mkdir -p dist
          cp "$APK" dist/StoreAMO-Bootstrap-0.0.2.apk
          sha256sum dist/StoreAMO-Bootstrap-0.0.2.apk > dist/SHA256SUMS.txt
          sha256sum -c dist/SHA256SUMS.txt
          unzip -tqq dist/StoreAMO-Bootstrap-0.0.2.apk

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: StoreAMO-Bootstrap-0.0.2
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish-bootstrap:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: StoreAMO-Bootstrap-0.0.2
          path: dist
      - name: Replace old bootstrap and publish 0.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="dist/StoreAMO-Bootstrap-0.0.2.apk"
          test -s "$APK"
          test -s dist/SHA256SUMS.txt
          sha256sum -c dist/SHA256SUMS.txt

          OLD_TAG="bootstrap-v0.0.1"
          NEW_TAG="bootstrap-v0.0.2"
          if gh release view "$OLD_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "Removed obsolete $OLD_TAG release and tag."
          fi

          if gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$NEW_TAG already exists; leaving verified release unchanged."
            exit 0
          fi

          gh release create "$NEW_TAG" "$APK" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "StoreAMO Bootstrap 0.0.2" \
            --notes "Bootstrap permission-first de StoreAMO. Antes de descargar pide a Android la autorización 'Permitir desde esta fuente'; al volver descubre la release estable actual, descarga por HTTPS, verifica SHA-256/firma mediante el pipeline de StoreAMO y continúa la actualización. Declara también la capacidad de solicitar desinstalaciones oficiales; Android conserva la confirmación final cuando el sistema la exige. No pertenece al canal latest estable."
