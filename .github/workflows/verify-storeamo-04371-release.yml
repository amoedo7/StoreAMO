name: verify-storeamo-04371-release

on:
  push:
    branches:
      - main
    paths:
      - release-04371.verify

permissions:
  contents: write

concurrency:
  group: verify-storeamo-04371-release
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare canonical StoreAMO signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 -d ci/storeamo-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/storeamo-debug.keystore"

      - name: Validate migration regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_one_tap_update.py
          python scripts/validate_04365_features.py
          python scripts/validate_install_pipeline.py
          python scripts/validate_uninstall_04370.py
          python scripts/validate_signature_migration.py

      - name: Build StoreAMO 0.4.3.71
        id: build
        env:
          STOREAMO_DEBUG_KEYSTORE: ${{ runner.temp }}/storeamo-debug.keystore
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug --stacktrace
          APK='app/build/outputs/apk/debug/app-debug.apk'
          OUT='StoreAMO-0.4.3.71.apk'
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.desarrollamo.storeamo.debug' versionCode='430071' versionName='0.4.3.71'" "$RUNNER_TEMP/badging.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n1 | tr 'A-F' 'a-f')"
          test "${#CERT}" -eq 64
          mkdir -p dist
          cp "$APK" "dist/$OUT"
          SHA="$(sha256sum "dist/$OUT" | awk '{print $1}')"
          SIZE="$(stat -c%s "dist/$OUT")"
          printf '%s  %s\n' "$SHA" "$OUT" > dist/SHA256SUMS.txt
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "STOREAMO_04371_BUILD_OK $SHA $CERT $SIZE"

      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.4.3.71'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/StoreAMO-0.4.3.71.apk dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/StoreAMO-0.4.3.71.apk dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'StoreAMO 0.4.3.71' \
              --notes 'Migración única guiada para la build legacy de DepositAMO con firma efímera. Después de esa migración, la línea canónica conserva firma y se actualiza in-place.' \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Prove anonymous public APK download
        env:
          EXPECTED_SHA: ${{ steps.build.outputs.sha }}
          EXPECTED_CERT: ${{ steps.build.outputs.cert }}
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/amoedo7/StoreAMO/releases/download/v0.4.3.71/StoreAMO-0.4.3.71.apk'
          BT="$ANDROID_HOME/build-tools/34.0.0"
          ok=0
          for n in $(seq 1 18); do
            if curl -fsSL --retry 2 --connect-timeout 15 --max-time 90 "$URL" -o "$RUNNER_TEMP/public.apk"; then
              ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/public.apk" | awk '{print $1}')"
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                "$BT/aapt" dump badging "$RUNNER_TEMP/public.apk" | grep -q "package: name='com.desarrollamo.storeamo.debug' versionCode='430071' versionName='0.4.3.71'"
                "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/public.apk" > "$RUNNER_TEMP/public-apksigner.txt"
                ACTUAL_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/public-apksigner.txt" | head -n1 | tr 'A-F' 'a-f')"
                test "$ACTUAL_CERT" = "$EXPECTED_CERT"
                echo "PUBLIC_STOREAMO_04371_OK $ACTUAL_SHA $ACTUAL_CERT"
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: Record passing evidence
        env:
          SHA: ${{ steps.build.outputs.sha }}
          CERT: ${{ steps.build.outputs.cert }}
          SIZE: ${{ steps.build.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cat > verification/storeamo-0.4.3.71-release.txt <<EOF
          STOREAMO_04371_RELEASE=PASS
          version=0.4.3.71
          version_code=430071
          package=com.desarrollamo.storeamo.debug
          sha256=$SHA
          signing_cert_sha256=$CERT
          size_bytes=$SIZE
          public_url=https://github.com/amoedo7/StoreAMO/releases/download/v0.4.3.71/StoreAMO-0.4.3.71.apk
          migration=DepositAMO legacy signer -> canonical signer, once only
          future_updates=in-place with signer continuity
          run_id=$GITHUB_RUN_ID
          EOF
          sed -i 's/^          //' verification/storeamo-0.4.3.71-release.txt
          git config user.name 'StoreAMO Release Verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add verification/storeamo-0.4.3.71-release.txt
          if ! git diff --cached --quiet; then
            git commit -m 'verify: StoreAMO 0.4.3.71 public release PASS [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
