name: update-safety-ci

on:
  push:
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle'
      - 'docs/UPDATES_SCRIPTS_AND_DISCOVERY.md'
      - 'scripts/validate_update_safety.py'
      - '.github/workflows/update-safety-ci.yml'
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle'
      - 'docs/UPDATES_SCRIPTS_AND_DISCOVERY.md'
      - 'scripts/validate_update_safety.py'
      - '.github/workflows/update-safety-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'
      - name: Validate StoreAMO update safety invariants
        run: python scripts/validate_update_safety.py
      - name: Run deterministic update policy and preferences tests
        run: gradle :app:testDebugUnitTest --tests 'com.desarrollamo.storeamo.update.*' --stacktrace
