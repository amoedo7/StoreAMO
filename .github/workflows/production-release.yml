name: production-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release/trigger-v0.4.3.82'

permissions:
  contents: write

jobs:
  sign-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'

      - name: Require first canonical production release
        run: |
          set -euo pipefail
          if gh release view v0.4.3.82 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.4.3.82 already exists; refusing to generate another production identity.' >&2
            exit 1
          fi
          test -s release/storeamo-recovery-public.pem
          openssl x509 -in release/storeamo-recovery-public.pem -noout -subject -fingerprint -sha256

      - name: Establish first permanent production signing identity
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/storeamo-release.p12"
          RECOVERY_TXT="$RUNNER_TEMP/RECOVERY.txt"
          RECOVERY_TAR="$RUNNER_TEMP/StoreAMO-signing-recovery-v1.tar.gz"
          PASS="$(openssl rand -hex 32)"
          ALIAS='storeamo-release'
          echo "::add-mask::$PASS"

          keytool -genkeypair -v \
            -keystore "$KS" -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -sigalg SHA256withRSA -validity 10000 \
            -dname 'CN=DesarrollAMO StoreAMO Release, OU=Mobile, O=DesarrollAMO, C=AR'
          chmod 600 "$KS"

          CERT_SHA="$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          test -n "$CERT_SHA"
          cat > "$RECOVERY_TXT" <<EOF
          STOREAMO PRODUCTION SIGNING RECOVERY v1
          Alias: $ALIAS
          Store password: $PASS
          Key password: $PASS
          Certificate SHA-256: $CERT_SHA
          Canonical package: com.desarrollamo.storeamo
          First release: 0.4.3.82
          EOF
          chmod 600 "$RECOVERY_TXT"

          tar -C "$RUNNER_TEMP" -czf "$RECOVERY_TAR" storeamo-release.p12 RECOVERY.txt
          mkdir -p dist/recovery
          openssl cms -encrypt -binary -aes256 \
            -in "$RECOVERY_TAR" -outform DER \
            -out dist/recovery/StoreAMO-signing-recovery-v1.cms \
            release/storeamo-recovery-public.pem
          test -s dist/recovery/StoreAMO-signing-recovery-v1.cms
          rm -f "$RECOVERY_TXT" "$RECOVERY_TAR"

          printf 'ACTIVE_STORE_PASSWORD=%s\n' "$PASS" >> "$GITHUB_ENV"
          printf 'ACTIVE_KEY_PASSWORD=%s\n' "$PASS" >> "$GITHUB_ENV"
          printf 'ACTIVE_KEY_ALIAS=%s\n' "$ALIAS" >> "$GITHUB_ENV"
          printf 'ACTIVE_CERT_SHA=%s\n' "$CERT_SHA" >> "$GITHUB_ENV"
          echo "Production certificate SHA-256: $CERT_SHA"

      - name: Build unsigned release APKs
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :bootstrap:assembleRelease --stacktrace

      - name: Sign and verify production APKs
        run: |
          set -euo pipefail
          STORE_IN="app/build/outputs/apk/release/app-release-unsigned.apk"
          BOOT_IN="bootstrap/build/outputs/apk/release/bootstrap-release-unsigned.apk"
          test -s "$STORE_IN"
          test -s "$BOOT_IN"
          mkdir -p dist/store dist/bootstrap

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/storeamo-release.p12" --ks-key-alias "$ACTIVE_KEY_ALIAS" \
            --ks-pass env:ACTIVE_STORE_PASSWORD --key-pass env:ACTIVE_KEY_PASSWORD \
            --out dist/store/StoreAMO-0.4.3.82.apk "$STORE_IN"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/storeamo-release.p12" --ks-key-alias "$ACTIVE_KEY_ALIAS" \
            --ks-pass env:ACTIVE_STORE_PASSWORD --key-pass env:ACTIVE_KEY_PASSWORD \
            --out dist/bootstrap/StoreAMO-Bootstrap-0.0.5.apk "$BOOT_IN"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs dist/store/StoreAMO-0.4.3.82.apk | tee /tmp/store-signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs dist/bootstrap/StoreAMO-Bootstrap-0.0.5.apk | tee /tmp/bootstrap-signature.txt
          STORE_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/store-signature.txt | head -1 | tr '[:lower:]' '[:upper:]')"
          BOOT_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/bootstrap-signature.txt | head -1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$ACTIVE_CERT_SHA" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$STORE_CERT"
          test "$STORE_CERT" = "$BOOT_CERT"
          test "$(printf '%s' "$STORE_CERT" | tr -d ':')" = "$EXPECTED"

      - name: Verify identities, permissions and hashes
        run: |
          set -euo pipefail
          STORE="dist/store/StoreAMO-0.4.3.82.apk"
          BOOT="dist/bootstrap/StoreAMO-Bootstrap-0.0.5.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$STORE" | tee /tmp/store-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo' versionCode='430082' versionName='0.4.3.82'" /tmp/store-badging.txt
          ! grep -q 'application-debuggable' /tmp/store-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$BOOT" | tee /tmp/bootstrap-badging.txt
          grep -q "package: name='com.desarrollamo.storeamo.bootstrap' versionCode='5' versionName='0.0.5'" /tmp/bootstrap-badging.txt
          ! grep -q 'application-debuggable' /tmp/bootstrap-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$BOOT" | tee /tmp/bootstrap-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/bootstrap-permissions.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/bootstrap-permissions.txt
          ! grep -q 'REQUEST_DELETE_PACKAGES\|QUERY_ALL_PACKAGES\|PACKAGE_USAGE_STATS\|SYSTEM_ALERT_WINDOW\|BIND_ACCESSIBILITY_SERVICE' /tmp/bootstrap-permissions.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$STORE" | tee /tmp/store-permissions.txt
          ! grep -q 'REQUEST_INSTALL_PACKAGES\|REQUEST_DELETE_PACKAGES\|QUERY_ALL_PACKAGES' /tmp/store-permissions.txt
          (cd dist/store && sha256sum StoreAMO-0.4.3.82.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          (cd dist/bootstrap && sha256sum StoreAMO-Bootstrap-0.0.5.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Publish production StoreAMO
        run: |
          set -euo pipefail
          gh release create v0.4.3.82 \
            dist/store/StoreAMO-0.4.3.82.apk \
            dist/store/SHA256SUMS.txt \
            dist/recovery/StoreAMO-signing-recovery-v1.cms \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'StoreAMO 0.4.3.82' \
            --notes "Primera StoreAMO con package canónico com.desarrollamo.storeamo y firma permanente de producción. Certificado SHA-256: ${ACTIVE_CERT_SHA}. StoreAMO no solicita permisos para instalar ni eliminar paquetes. El backup de firma publicado está cifrado para la clave privada de recuperación externa."

      - name: Publish StoreAMO Install 0.0.5
        run: |
          set -euo pipefail
          gh release create bootstrap-v0.0.5 \
            dist/bootstrap/StoreAMO-Bootstrap-0.0.5.apk \
            dist/bootstrap/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'StoreAMO Install 0.0.5' \
            --notes "Instalador dedicado firmado con la identidad de producción ${ACTIVE_CERT_SHA}. Sólo INTERNET + REQUEST_INSTALL_PACKAGES; requiere autorización y confirmación visibles de Android. No desactiva ni elude Play Protect."
          for OLD in bootstrap-v0.0.3 bootstrap-v0.0.4; do
            if gh release view "$OLD" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$OLD" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done
