name: apply StoreAMO 0.4.3.65 patch

on:
  push:
    branches:
      - feat/storeamo-news-uninstall
    paths:
      - scripts/apply_04365_patch.py
      - .github/workflows/apply-04365-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/storeamo-news-uninstall
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply guarded source patch
        run: python scripts/apply_04365_patch.py
      - name: Validate feature markers
        run: python scripts/validate_04365_features.py
      - name: Commit generated source and remove temporary patcher
        run: |
          rm -f scripts/apply_04365_patch.py .github/workflows/apply-04365-patch.yml
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: StoreAMO 0.4.3.65 Buenas Nuevas y Desinstalar'
          git push origin HEAD:feat/storeamo-news-uninstall
