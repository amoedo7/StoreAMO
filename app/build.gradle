plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releasePatch = (project.findProperty('storeamo.versionPatch') ?: '82').toInteger()
def devVersionCode = 430000 + releasePatch
def devVersionName = "0.4.3.${releasePatch}"

android {
    namespace 'com.desarrollamo.storeamo'
    compileSdk 34

    defaultConfig {
        applicationId "com.desarrollamo.storeamo"
        minSdk 26
        targetSdk 34
        versionCode devVersionCode
        versionName devVersionName
        buildConfigField 'boolean', 'BOOTSTRAP_SEED', 'false'
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.8'
    implementation 'androidx.compose.foundation:foundation:1.6.8'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.8'
    testImplementation 'junit:junit:4.13.2'
}
