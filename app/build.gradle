plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciRunNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def stableVersionCode = 500000 + ciRunNumber
def stableVersionName = "0.5.0.${ciRunNumber}"
def signingStoreFile = System.getenv('STOREAMO_KEYSTORE_PATH')
def signingStorePassword = System.getenv('STOREAMO_STORE_PASSWORD')
def signingKeyAlias = System.getenv('STOREAMO_KEY_ALIAS')
def signingKeyPassword = System.getenv('STOREAMO_KEY_PASSWORD')
def releaseSigningRequired = (System.getenv('CI_RELEASE_SIGNING_REQUIRED') ?: 'false').toBoolean()
def hasReleaseSigning = [signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.desarrollamo.storeamo'
    compileSdk 34

    defaultConfig {
        applicationId "com.desarrollamo.storeamo"
        minSdk 26
        targetSdk 34
        versionCode stableVersionCode
        versionName stableVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            create('secureRelease') {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.secureRelease
            } else if (releaseSigningRequired) {
                throw new GradleException('StoreAMO stable signing secrets are required; signing material must never be committed to Git')
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.8'
    implementation 'androidx.compose.foundation:foundation:1.6.8'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.8'
}
